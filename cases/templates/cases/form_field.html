<label class="form-label mb-1" for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}
</label>
{{ field }}
{% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
{% if field.errors %}
    <ul class="text-danger small ps-3 mb-0" id="{{ field.auto_id }}_error">
        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
{% endif %}
